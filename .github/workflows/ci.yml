name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest

    # F-009 A18a: same major version as production (ADR-0013), never SQLite.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rakyt_booking_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: rakyt_booking_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, gd, exif, fileinfo, intl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        run: npm ci

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint
        run: |
          ./vendor/bin/pint --test
          npm run lint -- --max-warnings=0

      - name: Build assets
        run: npm run build

      # F-002 AC-33: public pages stay within their JavaScript budget.
      - name: Check public page bundle size
        run: npm run check:bundle

      - name: Run JS unit tests
        run: npm test

      - name: Run tests
        run: php artisan test

  security:
    name: Dependency & secret scan
    runs-on: ubuntu-latest

    # gitleaks-action lists the PR's commits through the API.
    permissions:
      contents: read
      pull-requests: read

    # F-009 A18: a high-severity advisory or a detected secret fails the build.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: composer audit
        run: |
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          composer audit

      - name: npm audit
        run: |
          npm ci
          npm audit --audit-level=high

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
